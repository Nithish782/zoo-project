{% extends "base.html" %}

{% block content %}
<h2>Add Feed Schedule</h2>

<form method="POST" class="card p-4 shadow">
    <input name="animal_id" placeholder="Animal ID" class="form-control mb-2">
    <input name="time" placeholder="Time (e.g. 10 AM)" class="form-control mb-2">
    <input name="food" placeholder="Food" class="form-control mb-2">

    <button class="btn btn-primary">Add</button>
</form>
{% endblock %}
