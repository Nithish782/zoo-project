{% extends "base.html" %}

{% block content %}
<h2>Add Visitor</h2>

<form method="POST" class="card p-4 shadow">
    <input name="visitor_id" placeholder="ID" class="form-control mb-2">
    <input name="name" placeholder="Name" class="form-control mb-2">
    <input name="age" type="number" placeholder="Age" class="form-control mb-2">
    <input name="ticket_id" placeholder="Ticket ID" class="form-control mb-2">

    <button class="btn btn-primary">Add</button>
</form>
{% endblock %}
