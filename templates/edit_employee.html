{% extends "base.html" %}

{% block content %}

<h2>Edit Employee</h2>

<form method="POST" class="card p-4 shadow">

    <input value="{{ emp[1] }}" name="name" class="form-control mb-2">
    <input value="{{ emp[2] }}" name="role" class="form-control mb-2">
    <input value="{{ emp[3] }}" name="salary" class="form-control mb-2">

    <button class="btn btn-warning">Update</button>

</form>

{% endblock %}
