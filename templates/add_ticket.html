{% extends "base.html" %}

{% block content %}
<h2>Add Ticket</h2>

<form method="POST" class="card p-4 shadow">
    <input name="ticket_id" placeholder="Ticket ID" class="form-control mb-2">
    <input name="price" placeholder="Price" class="form-control mb-2">
    <input name="visitor_name" placeholder="Visitor Name" class="form-control mb-2">

    <button class="btn btn-success">Add Ticket</button>
</form>
{% endblock %}
