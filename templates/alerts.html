{% extends "base.html" %}

{% block content %}

<h2>🚨 Alerts</h2>

{% if alerts %}
    <table class="table table-striped">
        <tr>
            <th>Message</th>
        </tr>

        {% for alert in alerts %}
        <tr>
            <td>{{ alert }}</td>
        </tr>
        {% endfor %}

    </table>
{% else %}
    <p>No alerts yet</p>
{% endif %}

{% endblock %}
