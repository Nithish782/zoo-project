{% extends "base.html" %}

{% block content %}

<h2>🚨 Alerts</h2>

<table class="table table-striped">
    <tr>
        <th>ID</th>
        <th>Message</th>
        <th>Time</th>
    </tr>

    {% for alert in alerts %}
    <tr>
        <td>{{ alert[0] }}</td>
        <td>{{ alert[1] }}</td>
        <td>{{ alert[2] }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
