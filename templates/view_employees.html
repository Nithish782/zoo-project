{% extends "base.html" %}
{% block content %}

<h2>Employees</h2>


<table class="table table-striped">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Role</th>
    <th>Salary</th>
    <th>Action</th>
</tr>

{% for e in employees %}
<tr>
<td>{{ e[0] }}</td>
<td>{{ e[1] }}</td>
<td>{{ e[2] }}</td>
<td>{{ e[3] }}</td>

<td>
    <a href="/edit_employee/{{ e[0] }}" class="btn btn-warning btn-sm">Edit</a>
    <a href="/delete_employee/{{ e[0] }}" 
   onclick="return confirm('Are you sure?')" 
   class="btn btn-danger btn-sm">Delete</a>
</td>

</tr>
{% endfor %}
</table>

{% endblock %}
