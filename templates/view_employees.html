{% extends "base.html" %}
{% block content %}


<h2>Employee Management</h2>

<div class="card p-3 shadow mb-4">
    <h4>Add Employee</h4>
    <form method="POST">

        <div class="row">
            <div class="col-md-3">
                <input type="text" name="emp_id" class="form-control" placeholder="ID" required>
            </div>

            <div class="col-md-3">
                <input type="text" name="name" class="form-control" placeholder="Name" required>
            </div>

            <div class="col-md-3">
                <input type="text" name="role" class="form-control" placeholder="Role" required>
            </div>

            <div class="col-md-3">
                <input type="number" name="salary" class="form-control" placeholder="Salary" required>
            </div>
        </div>

        <button class="btn btn-success mt-3">Add Employee</button>
    </form>
</div>

<table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for emp in employees %}
        <tr>
            <td>{{ emp[0] }}</td>
            <td>{{ emp[1] }}</td>
            <td>{{ emp[2] }}</td>
            <td>{{ emp[3] }}</td>
            <td>
                <a href="/edit_employee/{{ emp[0] }}" class="btn btn-warning btn-sm">Edit</a>
                <a href="/delete_employee/{{ emp[0] }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Delete this employee?');">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>


{% endblock %}
