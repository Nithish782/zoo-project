{% extends "base.html" %}

{% block content %}

<h2>Add Animal</h2>

<form method="POST" class="card p-4 shadow">

    <input name="animal_id" placeholder="ID" class="form-control mb-2">
    <input name="name" placeholder="Name" class="form-control mb-2">
    <input name="species" placeholder="Species" class="form-control mb-2">
    <input name="age" type="number" placeholder="Age" class="form-control mb-2">
    <input name="health_status" placeholder="Health" class="form-control mb-2">

    <button class="btn btn-success">Add Animal</button>

</form>

{% endblock %}
