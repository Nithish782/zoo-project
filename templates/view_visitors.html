{% extends "base.html" %}

{% block content %}


<h2>Visitor Management</h2>

<div class="card p-3 shadow mb-4">
    <h4>Add Visitor</h4>

    <form method="POST">
        <div class="row">

            <div class="col-md-3">
                <input type="text" name="visitor_id" class="form-control" placeholder="ID" required>
            </div>

            <div class="col-md-3">
                <input type="text" name="name" class="form-control" placeholder="Name" required>
            </div>

            <div class="col-md-3">
                <input type="number" name="age" class="form-control" placeholder="Age" required>
            </div>

            <div class="col-md-3">
                <input type="text" name="ticket_id" class="form-control" placeholder="Ticket ID" required>
            </div>

        </div>

        <button class="btn btn-success mt-3">Add Visitor</button>
    </form>
</div>

<table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Ticket</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for v in visitors %}
        <tr>
            <td>{{ v[0] }}</td>
            <td>{{ v[1] }}</td>
            <td>{{ v[2] }}</td>
            <td>{{ v[3] }}</td>
            <td>
                <a href="/edit_visitor/{{ v[0] }}" class="btn btn-warning btn-sm">Edit</a>
                 <a href="/delete_visitor/{{ v[0] }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Delete this visitor?');">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
