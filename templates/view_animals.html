{% extends "base.html" %}

{% block content %}

<h2>Animal List</h2>

<form action="/search" method="GET" class="mb-3 d-flex">
    <input type="text" name="q" class="form-control me-2" placeholder="Search animal...">
    <button class="btn btn-primary">Search</button>
</form>

<table class="table table-striped shadow">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Species</th>
            <th>Age</th>
            <th>Health</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for a in animals %}
        <tr>
            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>{{ a[3] }}</td>
            <td>{{ a[4] }}</td>
            <td>
                <a href="/delete_animal/{{ a[0] }}" class="btn btn-danger btn-sm">Delete</a>
            </td>
            <td>
                <a href="/edit_animal/{{ a[0] }}" class="btn btn-warning btn-sm">Edit</a>
                <a href="/delete_animal/{{ a[0] }}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
