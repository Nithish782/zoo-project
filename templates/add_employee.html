{% extends "base.html" %}
{% block content %}

<h2>Add Employee</h2>

<form method="POST" class="card p-4 shadow">
    <input name="emp_id" placeholder="ID" class="form-control mb-2">
    <input name="name" placeholder="Name" class="form-control mb-2">
    <input name="role" placeholder="Role" class="form-control mb-2">
    <input name="salary" placeholder="Salary" class="form-control mb-2">

    <button class="btn btn-success">Add</button>
</form>

{% endblock %}
