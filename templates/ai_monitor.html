<!DOCTYPE html>
<html>
<head>
    <title>AI Monitoring</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #fff;
        }

        header {
            background: #020617;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #1e293b;
        }

        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .video-box {
            flex: 3;
            background: #020617;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }

        .video-box img {
            width: 100%;
            border-radius: 10px;
        }

        .alert-box {
            flex: 1;
            background: #020617;
            padding: 15px;
            border-radius: 10px;
            height: 500px;
            overflow-y: auto;
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }

        .alert-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #f87171;
        }

        .alert {
            background: #1e293b;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid red;
            border-radius: 5px;
        }

        .status {
            margin-top: 10px;
            color: #22c55e;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    🤖 AI Zoo Monitoring Dashboard
</header>

<div class="container">

    <!-- VIDEO SECTION -->
    <div class="video-box">
        <h3>Live Feed</h3>

        <!-- Your video stream -->
        <!-- <img src="{{ url_for('video_feed') }}"> -->
        <img src="/video_feed" width="800">

        <div class="status">🟢 System Running</div>
    </div>


</div>

</body>
</html>
