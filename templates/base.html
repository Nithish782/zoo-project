<!DOCTYPE html>
<html>
<head>
    <title>Zoo Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar p-3">
        <h4 class="text-white">🐾 Zoo</h4>
        <hr>

        <a href="/" class="menu"><i class="fas fa-home"></i> Dashboard</a>

        <a href="/animals" class="menu"><i class="fas fa-paw"></i> Animals</a>
        <a href="/employees" class="menu"><i class="fas fa-users"></i> Employees</a>
        <a href="/visitors" class="menu"><i class="fas fa-user"></i> Visitors</a>
        <a href="/tickets" class="menu"><i class="fas fa-ticket"></i> Tickets</a>
        <a href="/feed" class="menu"><i class="fas fa-utensils"></i> Feed Schedule</a>

        <a href="/alerts" class="menu">
            <i class="fas fa-bell"></i> Alerts
        </a>

        <a href="/live" class="menu">
            <i class="fas fa-video"></i> AI Monitor
        </a>

        <a href="/logout" class="btn btn-danger btn-sm mt-3">Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content p-4">
        <nav class="navbar bg-light shadow-sm mb-3">
            <span class="navbar-brand">Admin Panel</span>
        </nav>

        {% block content %}{% endblock %}
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="alert alert-success">
            {{ messages[0] }}
        </div>
    {% endif %}
    {% endwith %}

</div>


</body>
<footer class="text-center mt-4">
    <hr>
    <p>© 2026 Zoo Management System | Developed by Nithi</p>
</footer>
</html>
